name: consolidar

# Consolidação serial (Princípio 1.5): cada instância só CRIA arquivos por item; esta Action
# REGENERA os artefatos derivados a cada push (determinístico, sem conflito de Git):
#   1. fatiar.py   -> rag/chunks/   (chunking estrutural por dispositivo das leis VERBATIM)
#   2. indexar.py  -> rag/index/    (índice invertido BM25 + metadados p/ retrieval híbrido)
#   3. consolidar.py -> MANIFESTO.json (estado de cada item)
#   4. rodar-evals.py -> GATE (citação correta): falha o build se um ground-truth ATIVO quebrar.
# Trazido pela Auditoria triplo-limpo (2026-06-19) + esteira RAG da instância PU (2026-06-20).

on:
  push:
    paths:
      - "leis/**"
      - "jurisprudencia/**"
      - "scripts/**"
      - "evals/**"
      - "rag/**"
      # T2/S2 (2026-07-03): o gate PRECISA cobrir o PRODUTO, não só o corpus RAG. Sem estes paths,
      # sabotar um Fi em engines/ ou o pipeline em zepec/ passava verde (o CI nem disparava).
      - "engines/**"
      - "zepec/**"
      - "tabelas/**"
      - "supabase/**"
      - ".github/workflows/consolidar.yml"
  # T2/S2: rodar o gate também em PULL REQUEST (não só push) — o produto é revisado antes do merge.
  # B-11 (auditoria 2026-07-05): paths do PR ALINHADOS ao push — faltavam jurisprudencia/** e rag/**
  # e inventario/**, então um PR que só mexesse nesses não disparava os gates (só no push pós-merge).
  pull_request:
    paths:
      - "leis/**"
      - "jurisprudencia/**"
      - "scripts/**"
      - "evals/**"
      - "rag/**"
      - "engines/**"
      - "zepec/**"
      - "tabelas/**"
      - "inventario/**"
      - "supabase/**"
      - ".github/workflows/consolidar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidar:
    runs-on: ubuntu-24.04            # runner pinado (Passo 1 — fim do "declarei != provei")
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # versão exata (era "3.x")
      - name: Instalar dependências fixadas
        run: pip install -r requirements.txt

      - name: Fatiar leis verbatim (rag/chunks/)
        run: python3 scripts/fatiar.py

      - name: Indexar (rag/index/)
        run: python3 scripts/indexar.py

      - name: Grafo de remissões (rag/grafo/ — B-6)
        run: python3 scripts/grafo_remissoes.py

      - name: Regenerar MANIFESTO.json
        run: python3 scripts/consolidar.py

      # L-T7-4: nenhum arquivo com coluna PII (proprietario/cpf/cnpj/…) nos dados brutos/limpos.
      # zepec/ferramenta/ excluído: é a saída do produto (cedentes) — proprietario esperado (D-DONO-17).
      - name: PII probe (T7)
        run: |
          SUJOS=$(git ls-files zepec/limpo zepec/oficial zepec/raw | while read f; do
            if head -1 "$f" 2>/dev/null | grep -qiE 'proprietario|contribuinte|documento|cpf|cnpj'; then echo "$f"; fi
          done || true)
          if [ -n "$SUJOS" ]; then echo "PII tracked: $SUJOS"; exit 1; fi

      # GATES ANTES de publicar (achado B-13/F-6): se um gate reprovar, o build falha SEM ter
      # commitado/pushado o índice quebrado. Reordenado em 2026-06-20 (antes commitava primeiro).
      # GATE de aceite (Parte 3): falha se algum ground-truth ATIVO quebrar (aguardando_verbatim não bloqueia).
      - name: Evals (gate = citação correta)
        run: python3 evals/rodar-evals.py

      # GATE do engine (1.3 — número nasce no engine): auto-teste das fórmulas OODC/TDC.
      - name: Engine OODC/TDC (auto-teste das fórmulas)
        run: python3 engines/tdc/oodc.py

      # T2/S2 — GATE do engine de CEDENTE (Fi Art. 24 LPUOS): auto-teste do pcpt.py.
      - name: Engine cedente PCpt (auto-teste do Fi escalonado)
        run: python3 engines/tdc/pcpt.py --demo

      # T2/S2 — GATE do PRODUTO: golden-assert sobre 7 cedentes reais (um por faixa Art. 24).
      # Sabotar um Fi no engine OU um Fi drifted no CSV entregue FALHA aqui (prova em docs/commit T2).
      - name: Produto (golden-assert do Fi sobre cedentes reais)
        run: python3 evals/eval-produto.py

      # T4 — GATE de conservação (Art. 129): Termo≠Atestado; RES.(tombamento)≠conservação.
      - name: Conservação (Art. 129, 3-estados — Termo→PENDENTE, RES→SEM_ATESTADO)
        run: python3 zepec/montar_base.py --autoteste

      # T3 — GATE do regime do PCpt: já-declarado (Art.125 §1º I) não recebe o escalonado como firme.
      - name: Regime PCpt (já-declarado × prospecção nova, Art.24 caput × Art.125)
        run: python3 zepec/enriquecer_oficial.py --autoteste

      # M0 — a divergência PCpt×certidões (~1,66×) é SURFAÇADA e 100% flagada, nunca escondida.
      - name: Divergência PCpt × certidões (surfaçar, não esconder)
        run: python3 evals/eval-divergencia-pcpt.py

      # G6 — GATE de mutação do Motor do Mapa: zona sabotada no pipeline DEVE produzir CAbás divergente.
      - name: Mutação zona (G6 — Motor do Mapa × Quadro 3)
        run: python3 evals/eval-zona-mutacao.py

      # Separação TDC×IPTU (plano 2026-07-04) — GATE: domínio carimbado (vocab fechado) + roteamento
      # provado (não-poluição, não-perda de 'compartilhado', PDE alcançável do TDC, anti-padrão eliminado).
      - name: Domínio TDC×IPTU (carimbo válido + roteamento provado)
        run: |
          python3 scripts/carimbar_dominio.py --check
          python3 evals/eval-dominio.py

      # Arrumação Drive — GATE: SEED em dia (× de-para), MESTRE reconciliado, loop end-to-end provado,
      # gate por fase (plano/execução).
      - name: Índice de arrumação (SEED×de-para, MESTRE×reconc., loop e2e, gate por fase)
        run: |
          python3 scripts/semear_indice_mestre.py --check
          python3 scripts/reconciliar_arrumacao.py --check
          python3 evals/eval-arrumacao.py
          python3 scripts/gate-arrumacao.py

      # GATE anti-oráculo + anti-regressão de escopo (mecaniza D2/D-DONO-15). Trava por grep o que
      # o escrutínio/decisões proíbem: (a) rótulo de DEMANDA no deliverable seller-only (D-DONO-15);
      # (b) reintrodução de liquidez/receptor como número vivo; (c) código lendo número de fórmula
      # de um CODEX-*.md (oráculo). Verde hoje; a partir de agora reprova se regredir.
      - name: Anti-oráculo / anti-demanda (D2 · D-DONO-15)
        run: |
          set -e
          if grep -rniE "FUNDURB \(liquidez\)|janela de mercado|liquidez_demanda" zepec/pipeline/ ; then
            echo "::error::rótulo/leitura de DEMANDA no produto seller-only (viola D-DONO-15)"; exit 1; fi
          if grep -rlnE "CODEX-[A-Za-z0-9-]*\.md" engines/ zepec/ scripts/ --include=*.py ; then
            echo "::error::código lê de CODEX-*.md (oráculo) — número de fórmula deve vir de tabela/engine (1.3)"; exit 1; fi
          echo "anti-oráculo/anti-demanda: OK"

      # Só DEPOIS dos gates verdes: commita os artefatos derivados. NÃO em pull_request
      # (PR não deve commitar/pushar; roda só os gates acima como check de merge).
      - name: Commitar artefatos derivados se mudaram (após gates verdes)
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet MANIFESTO.json rag/ leis/ ; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add MANIFESTO.json rag/ leis/
            git commit -m "consolidar: regenera MANIFESTO + índice RAG [skip ci]"
            git push
          else
            echo "Artefatos derivados já estão atualizados."
          fi
