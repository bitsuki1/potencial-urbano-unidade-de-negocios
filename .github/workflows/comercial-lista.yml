# Monta a LISTA DE VENDEDORES ENRIQUECIDA (nome do dono + limpeza público×privado + preço/frescor ITBI +
# dono agrupado + agenda) a partir de fontes PRIMÁRIAS. Disparo manual. Commita o CSV neste repo PRIVADO
# (decisão do MOU 2026-07-16: base com nomes vai no git, uso interno, repo privado confirmado).
# Fontes: cadastro IPTU 2020/2016 (com NOME) + guias de ITBI (valor/data). Cadeia PJ→sócio é OPCIONAL (v2).
# Pré-req: secret GOOGLE_SA_KEY (Drive, read-only). Nada de PII de contato aqui — isso é ferramenta externa.
name: comercial-lista

on:
  workflow_dispatch:
    inputs:
      iptu_drive_id:
        description: "Drive id do cadastro IPTU 2020/2016 (com nome). Default: recorte CEP-01/centro."
        required: true
        default: "1AV8v4esuCxGulgxvGskzo595vycDa3U-"
      iptu_url:
        description: "URL do cadastro IPTU citywide COM NOME (default: mirror 2016, cidade toda, 35 col). Vazio = usa o drive_id."
        required: false
        default: "https://media.githubusercontent.com/media/0x3333/iptu.go/master/IPTU-2016-06-03.CSV"
      iptu_url2:
        description: "2ª safra IPTU citywide COM NOME (fallback dos SQLs ainda sem dono; ex.: GeoSampa 2020). Vazio = só a 1ª."
        required: false
        default: ""
      iptu_drive_id2:
        description: "Alternativa à URL2: id Drive de uma 2ª safra IPTU com nome (fallback). Vazio = ignora."
        required: false
        default: ""
      itbi_drive_ids:
        description: "Drive ids das guias de ITBI (vírgula). Default: 2024,2023,2022,snapshot-2026."
        required: true
        default: "1DEzDLix11FtG_1lhKY1qhnXJAu23Nny_,1ZESc3arRBppUx9HNMdsYDQh8Urnupsrh,1uQw1WO9Bu5B_wnFDpC-K3gVzKKkCX0AY,1IvF7JkpiUWwGMZKaYPM9876ASF_YgjMt"
      com_pj:
        description: "Rodar a cadeia PJ→sócio (exige socios/empresas/holdings; pesado). true/false."
        required: true
        default: "false"
      socios_ids:
        description: "Se com_pj=true: ids Drive de empresas.csv,socios.csv,holdings.csv (vírgula, nessa ordem)."
        required: false
        default: "1uRWg7wA4KuppJ1TSdEwRmV3H06fTXlnj,1gftoKzFaD-NyKClBg3SH8Eo0FYncQYvt,1BrBRzC3G4atGZ8JqRZhGp4OnvBZTjOgr"
      receita_oficial:
        description: "Usar a base NACIONAL COMPLETA da Receita (espelho Cloudflare, streaming) em vez do dump parcial do Drive. true/false."
        required: false
        default: "false"
      receita_data:
        description: "Competência do espelho da Receita (pasta AAAA-MM-DD do espelho Cloudflare)."
        required: false
        default: "2026-06-14"

permissions:
  contents: write

concurrency:
  group: comercial-lista
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Libs
        run: pip install --quiet google-api-python-client google-auth openpyxl

      - name: Baixar cadastro IPTU (com nome)
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          set -e
          mkdir -p _comercial_in
          if [ -n "${{ inputs.iptu_url }}" ]; then
            echo "IPTU via URL: ${{ inputs.iptu_url }}"
            curl -fsSL "${{ inputs.iptu_url }}" -o _comercial_in/iptu.raw
          else
            python3 comercial/baixar_drive_sa.py "${{ inputs.iptu_drive_id }}" _comercial_in/iptu.raw
          fi
          # descompacta se for gzip
          if gzip -t _comercial_in/iptu.raw 2>/dev/null; then
            mv _comercial_in/iptu.raw _comercial_in/iptu.gz && gunzip -f _comercial_in/iptu.gz && mv _comercial_in/iptu _comercial_in/iptu.csv
          else
            mv _comercial_in/iptu.raw _comercial_in/iptu.csv
          fi
          echo "linhas IPTU: $(wc -l < _comercial_in/iptu.csv)"
          # 2ª safra opcional (fallback dos SQLs ainda sem dono) → iptu2.csv (o parser dedup por SQL, 1ª vence)
          if [ -n "${{ inputs.iptu_url2 }}" ]; then
            curl -fsSL "${{ inputs.iptu_url2 }}" -o _comercial_in/iptu2.raw || echo "aviso: falhou url2"
          elif [ -n "${{ inputs.iptu_drive_id2 }}" ]; then
            python3 comercial/baixar_drive_sa.py "${{ inputs.iptu_drive_id2 }}" _comercial_in/iptu2.raw || echo "aviso: falhou drive_id2"
          fi
          if [ -f _comercial_in/iptu2.raw ]; then
            if gzip -t _comercial_in/iptu2.raw 2>/dev/null; then
              mv _comercial_in/iptu2.raw _comercial_in/iptu2.gz && gunzip -f _comercial_in/iptu2.gz && mv _comercial_in/iptu2 _comercial_in/iptu2.csv
            else
              mv _comercial_in/iptu2.raw _comercial_in/iptu2.csv
            fi
            echo "linhas IPTU 2ª safra: $(wc -l < _comercial_in/iptu2.csv)"
          fi

      - name: Baixar guias de ITBI
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          set -e
          i=0
          IFS=',' read -ra IDS <<< "${{ inputs.itbi_drive_ids }}"
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | xargs)
            [ -z "$id" ] && continue
            python3 comercial/baixar_drive_sa.py "$id" "_comercial_in/itbi_$i.xlsx" || echo "aviso: falhou id $id"
            i=$((i+1))
          done
          ls -la _comercial_in/

      - name: (opcional) Baixar canônicas societárias (para um temp — recorte depois)
        if: ${{ inputs.com_pj == 'true' && inputs.socios_ids != '' && inputs.receita_oficial != 'true' }}
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          set -e
          mkdir -p _canonicas_in
          IFS=',' read -ra IDS <<< "${{ inputs.socios_ids }}"
          names=(empresas.csv socios.csv holdings.csv)
          i=0
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | xargs); [ -z "$id" ] && continue
            python3 comercial/baixar_drive_sa.py "$id" "_canonicas_in/${names[$i]}"
            i=$((i+1))
          done
          ls -la _canonicas_in/

      - name: Escopo — extrair os SQLs da nossa lista (só eles saem; o resto da cidade é descartado)
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          out = Path("_comercial_in/sqls.txt"); out.parent.mkdir(exist_ok=True)
          sqls = set()
          # escopo = SQLs dos VENDEDORES (cedentes) + dos COMPRADORES (receptores). Os dois lados
          # se enriquecem do MESMO cadastro IPTU + cadeia Receita; o resto da cidade é descartado.
          with open("casos-reais/tdc/LISTA-VENDEDORES.csv", encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  s = "".join(ch for ch in (r.get("sql") or "") if ch.isdigit())[:10]
                  if len(s) == 10: sqls.add(s)
          try:
              with open("casos-reais/tdc/LISTA-COMPRADORES.csv", encoding="utf-8") as f:
                  for r in csv.DictReader(f):
                      s = "".join(ch for ch in (r.get("sql_receptor") or "") if ch.isdigit())[:10]
                      if len(s) == 10: sqls.add(s)
          except FileNotFoundError:
              pass
          out.write_text("\n".join(sorted(sqls)), encoding="utf-8")
          print(f"escopo: {len(sqls)} SQLs (vendedores + compradores)")
          PY

      - name: Pipeline — ITBI → IPTU(escopado) → (PJ) → enriquecer
        run: |
          set -e
          python3 comercial/itbi_para_sql.py --entrada _comercial_in/itbi_*.xlsx || echo "ITBI: sem xlsx legível (segue sem preço)"
          SAFRAS="_comercial_in/iptu.csv"; [ -f _comercial_in/iptu2.csv ] && SAFRAS="$SAFRAS _comercial_in/iptu2.csv"
          python3 comercial/iptu2020_para_contribuinte.py --entrada $SAFRAS --filtro-sqls _comercial_in/sqls.txt
          if [ "${{ inputs.receita_oficial }}" = "true" ]; then
            # BASE NACIONAL COMPLETA (espelho Cloudflare, sem login/geobloqueio) — streaming: baixa 1 zip,
            # descompacta, filtra só os nossos CNPJs, APAGA, próximo. Pico de disco ~= 1 arquivo por vez.
            BASE="https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos/${{ inputs.receita_data }}"
            python3 comercial/recorta_receita_oficial.py --fase alvos --contrib zepec/oficial/iptu_contribuinte.csv --estado _rf
            for i in $(seq 0 9); do
              curl -fsSL --retry 5 --retry-delay 8 -o _rf.zip "$BASE/Empresas${i}.zip" || { echo "aviso: Empresas${i} falhou"; continue; }
              unzip -o -q _rf.zip -d _rf_csv && for c in _rf_csv/*; do python3 comercial/recorta_receita_oficial.py --fase empresas --entrada "$c" --estado _rf; done
              rm -rf _rf.zip _rf_csv
            done
            # 3 RODADAS = fecho de holding até 3 níveis: cada rodada descobre novos sócios-PJ (holdings)
            # e os adiciona ao conjunto needed; a rodada seguinte captura os sócios DELES. finalize dedup.
            for rodada in 1 2 3; do
              echo "--- socios rodada $rodada (fecho de holding) ---"
              for i in $(seq 0 9); do
                curl -fsSL --retry 5 --retry-delay 8 -o _rf.zip "$BASE/Socios${i}.zip" || { echo "aviso: Socios${i} falhou"; continue; }
                unzip -o -q _rf.zip -d _rf_csv && for c in _rf_csv/*; do python3 comercial/recorta_receita_oficial.py --fase socios --entrada "$c" --estado _rf; done
                rm -rf _rf.zip _rf_csv
              done
            done
            python3 comercial/recorta_receita_oficial.py --fase finalize --estado _rf --saida zepec/oficial/recorte
            python3 zepec/resolver_dono.py --base zepec/oficial/recorte || echo "resolver: sem saída (segue só PF)"
            rm -rf _rf zepec/oficial/recorte
          elif [ "${{ inputs.com_pj }}" = "true" ] && [ -f _canonicas_in/socios.csv ]; then
            # recorta em streaming (só os CNPJs que interessam) → resolver roda no recorte pequeno, sem OOM
            python3 comercial/recorta_canonicas.py --base _canonicas_in --contrib zepec/oficial/iptu_contribuinte.csv --saida zepec/oficial/recorte
            python3 zepec/resolver_dono.py --base zepec/oficial/recorte || echo "resolver: sem saída (segue só PF)"
            rm -rf _canonicas_in zepec/oficial/recorte
          fi
          python3 comercial/enriquecer_lista.py
          python3 comercial/enriquecer_compradores.py

      - name: Provas (autotestes)
        run: |
          python3 comercial/iptu2020_para_contribuinte.py --autoteste
          python3 comercial/itbi_para_sql.py --autoteste
          python3 comercial/enriquecer_lista.py --autoteste
          python3 comercial/enriquecer_compradores.py --autoteste
          python3 comercial/recorta_receita_oficial.py --autoteste

      - name: Commitar lista enriquecida
        run: |
          set -e
          rm -rf _comercial_in
          git config user.name "comercial-bot"
          git config user.email "comercial-bot@users.noreply.github.com"
          git add casos-reais/tdc/LISTA-VENDEDORES-ENRIQUECIDA.csv casos-reais/tdc/LISTA-COMPRADORES-ENRIQUECIDA.csv zepec/oficial/iptu_flags.csv zepec/oficial/itbi_por_sql.csv zepec/oficial/_itbi_sql_raw.txt || true
          if git diff --cached --quiet; then echo "nada a commitar"; exit 0; fi
          git commit -m "lista de vendedores ENRIQUECIDA (nome+limpeza+preco ITBI+carteira) [skip ci]"
          for t in 1 2 4 8; do
            git fetch origin ${{ github.ref_name }} && git rebase origin/${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep $t
          done
