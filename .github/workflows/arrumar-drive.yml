# Arrumação do Drive via CONTA DE SERVIÇO (o "robô") — disparo MANUAL, ensaio primeiro.
# Roda o move dirigido pelo de-para auditado. O log deste workflow é lido pelo assistente
# direto pela API (fonte confiável) — a aceitação final é a CONTAGEM da _entrada antes/depois.
# Pré-requisito: secret GOOGLE_SA_KEY (JSON da conta de serviço) setado neste repo.
name: arrumar-drive

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = ENSAIO (não move nada). Só 'false' move de verdade."
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      acao:
        description: "arrumar = move pelo de-para; selo = só PROVA o topo (read-only)."
        required: true
        default: "arrumar"
        type: choice
        options: ["arrumar", "selo"]

permissions:
  contents: read

concurrency:
  group: arrumar-drive          # nunca duas execuções simultâneas movendo os mesmos arquivos
  cancel-in-progress: false

jobs:
  arrumar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instalar libs do Google
        run: pip install --quiet google-api-python-client google-auth
      - name: Rodar (acao=${{ inputs.acao }} DRY_RUN=${{ inputs.dry_run }})
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ inputs.acao }}" = "selo" ]; then
            python3 scripts/selo_arrumacao_sa.py
          else
            python3 scripts/mover_por_destino_sa.py
          fi
