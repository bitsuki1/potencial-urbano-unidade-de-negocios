# capturar-br — roda no runner `brasil` (VPS com IP do Brasil, sem o proxy de egresso desta sessão).
# Objetivo: destravar as fontes .gov.br que STF/STJ/TJSP só servem do Brasil.
#   • Item 3/7 — inteiro teor da jurisprudência, metade-runner (STF RE 226942/387047 + TJSP AI cposg).
#   • Item #21 — busca de ampliação TDC (STF API + SCON/STJ), resultado verbatim p/ curadoria.
# Desde 2026-08-07 a CAPTURA é por NAVEGADOR REAL (Playwright em Docker, --network host — mesmo
# padrão do geosampa-siszon.yml do hub): o WAF AWS do STF derruba urllib puro (desafio JS).
# A EXTRAÇÃO (PDF→texto→.md/.json) segue no Python (capturar_juris_portais.py --extrair), fail-closed.
name: capturar-br

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "probe (só testa alcance) | capturar (navegador real + extração, fail-closed)"
        required: true
        default: "probe"
        type: choice
        options: ["probe", "capturar"]
  push:
    paths:
      - ".github/workflows/capturar-br.yml"
      - "scripts/capturar_juris_portais.py"
      - "scripts/capturar_juris_br.js"

concurrency:
  group: capturar-br
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capturar-br:
    runs-on: [self-hosted, brasil]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Probe da rota BR (curl bruto — independe do Python)
        run: |
          echo "runner: $(hostname) | IP público:"; curl -sS -m 20 https://api.ipify.org || true; echo
          for u in \
            "https://jurisprudencia.stf.jus.br" \
            "https://esaj.tjsp.jus.br/cposg/open.do" \
            "https://scon.stj.jus.br/SCON/"; do
            echo "=== $u ==="
            curl -sS -m 30 -o /dev/null -w "HTTP %{http_code} | %{time_total}s\n" "$u" || echo "FALHOU (rede/TLS)"
          done
      - name: Captura por navegador real (Playwright em Docker, IP-BR via --network host)
        if: ${{ github.event.inputs.modo == 'capturar' }}
        run: |
          set -e
          sudo docker --version
          RUID=$(id -u); RGID=$(id -g)
          mkdir -p jurisprudencia/_capturas
          # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1: a imagem já traz o Chromium (ver geosampa-siszon.yml)
          sudo docker run --rm --network host \
            --user "$RUID:$RGID" \
            -e OUT_DIR=/work/jurisprudencia/_capturas -e HOME=/tmp \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -v "$GITHUB_WORKSPACE:/work" \
            mcr.microsoft.com/playwright:v1.47.2-jammy \
            sh -c "cd /tmp && npm install --no-save --no-audit --no-fund playwright@1.47.2 && NODE_PATH=/tmp/node_modules node /work/scripts/capturar_juris_br.js"
      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.modo == 'capturar' }}
        with:
          python-version: "3.x"
      - name: Extração fail-closed (PDF/HTML capturados → .md/.json)
        if: ${{ github.event.inputs.modo == 'capturar' }}
        run: |
          pip install --quiet pypdf
          python3 scripts/capturar_juris_portais.py --extrair || true
      - name: Commit do que capturou (só se houver novos arquivos)
        if: ${{ github.event.inputs.modo == 'capturar' }}
        run: |
          git config user.name "runner-brasil"
          git config user.email "runner@potencial-urbano"
          git add jurisprudencia/ || true
          if ! git diff --cached --quiet; then
            git commit -m "capturar-br: inteiro teor da jurisprudência (navegador real, metade-runner) [skip ci]"
            for i in 1 2 3 4; do git push && break || { git pull --rebase || true; sleep $((2**i)); }; done
          else
            echo "nada novo para commitar (fail-closed ou já capturado)."
          fi
