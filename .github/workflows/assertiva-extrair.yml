name: assertiva-extrair
# ESTREIA PAGA da Assertiva (autorizada pelo dono 2026-08-06). Consulta Localize v3 por
# CPF/CNPJ dos donos-alvo (1 consulta por dono, idempotente) e grava contatos DIRETO no
# Supabase (crm_lead/crm_contato) — o contato nunca entra no git nem no contexto do LLM.
# Rodar com limite pequeno primeiro (validação), depois o lote.
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos donos consultar (custo ~R$0,12/consulta)"
        required: false
        default: "2"
      dry_run:
        description: "true = autentica e lê alvos, sem consulta paga nem escrita"
        required: false
        default: "false"
      debug_estrutura:
        description: "true = commita a ESTRUTURA (chaves/tipos, sem valores) da 1ª resposta"
        required: false
        default: "false"
      modo:
        description: "extrair (padrão) | descobrir (sonda rotas com doc INVÁLIDO — não fatura)"
        required: false
        default: "extrair"
      alvos:
        description: "Arquivo de alvos em tools/assertiva/ (lote 2 radial: alvos_lote2_radial.csv)"
        required: false
        default: "alvos_lote1_100.csv"
      dados_b64:
        description: "modo=carregar_lote: resultado da Consulta em Lote do painel (CSV gzip+base64 — PII nunca entra no git)"
        required: false
        default: ""
      lote_rotulo:
        description: "modo=carregar_lote: rótulo do lote p/ auditoria (ex.: lote-plataforma-t50)"
        required: false
        default: "lote-plataforma"
  # push registra o workflow (dispatch por API dá 404 até estar na main) e roda a
  # VALIDAÇÃO barata (limite 2) — o lote de 100 vai por dispatch depois do registro.
  push:
    branches: [claude/urban-potential-instance-l3zed9]
    paths: [".github/workflows/assertiva-extrair.yml"]
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]"
      - name: Extrair contatos (Assertiva -> Supabase)
        env:
          ASSERTIVA_CLIENT_ID: ${{ secrets.ASSERTIVA_CLIENT_ID }}
          ASSERTIVA_CLIENT_SECRET: ${{ secrets.ASSERTIVA_CLIENT_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "${{ github.event.inputs.modo }}" = "carregar_lote" ]; then
            echo "${{ github.event.inputs.dados_b64 }}" | base64 -d | gunzip > /tmp/lote_resultado.csv
            wc -c /tmp/lote_resultado.csv
            python3 tools/assertiva/carregar_lote_plataforma.py --csv /tmp/lote_resultado.csv --lote "${{ github.event.inputs.lote_rotulo }}"
          elif [ "${{ github.event.inputs.modo }}" = "uso" ]; then
            python3 tools/assertiva/relatorio_uso.py
          elif [ "${{ github.event.inputs.modo }}" = "descobrir" ]; then
            python3 tools/assertiva/descobrir_rotas.py
          else
            ARGS="--limite ${{ github.event.inputs.limite || '2' }} --alvos ${{ github.event.inputs.alvos || 'alvos_lote1_100.csv' }}"
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ "${{ github.event.inputs.debug_estrutura }}" = "true" ]; then ARGS="$ARGS --debug-estrutura"; fi
            python3 tools/assertiva/extrair_lote.py $ARGS
          fi
      - name: Commitar estrutura de debug (chaves/tipos, sem valores — sem PII)
        if: always()
        run: |
          if ls tools/assertiva/debug_estrutura.json tools/assertiva/rotas_descobertas.json tools/assertiva/openapi_conta.json 2>/dev/null | grep -q .; then
            git config user.name "assertiva-bot"; git config user.email "bot@users.noreply.github.com"
            git add tools/assertiva/debug_estrutura.json tools/assertiva/rotas_descobertas.json tools/assertiva/openapi_conta.json 2>/dev/null || true
            git commit -m "assertiva: diagnóstico (estrutura/rotas — sem PII) [skip ci]" || true
            for i in 1 2 3; do git push origin "HEAD:${GITHUB_REF_NAME}" && break || { git pull --rebase origin "${GITHUB_REF_NAME}" || true; sleep 2; }; done
          fi
